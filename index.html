<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>からだ日和</title>
<meta name="theme-color" content="#2C5641">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="からだ日和">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{color-scheme:light;
  --bg:#F6F3EC; --surface:#FFFFFF; --surface2:#FBF9F4; --line:#E5DED1; --line2:#D6CEBF;
  --ink:#1E2923; --ink2:#4F5B54; --ink3:#66706A;
  --green:#2C5641; --green2:#3B6B53; --greenSoft:#E3ECE5; --greenSoft2:#F0F5F1;
  --amber:#8A4F1C; --amberSoft:#F6EBDD;
  --m1:#B5562E; --m2:#D49A6A; --m3:#CDC4B1; --m4:#7FA48C; --m5:#2C5641;
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif;
  --serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Noto Serif CJK JP",serif;
  --r:20px; --shadow:0 1px 2px rgba(40,35,20,.05),0 6px 24px rgba(40,35,20,.06);
  --tabh:72px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #8DB39C;outline-offset:2px;border-radius:10px}
h1,h2,h3,p{margin:0}
.serif{font-family:var(--serif);font-weight:600;letter-spacing:.02em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- layout ---------- */
.app{min-height:100vh}
.side{display:none}
main{min-height:100vh;padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 24px)}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;height:56px;padding:0 12px 0 16px;background:rgba(246,243,236,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.topbar .brand{font-family:var(--serif);font-weight:600;font-size:18px;letter-spacing:.06em;color:var(--green)}
.topbar .ttl{font-weight:700;font-size:17px}
.topbar .sp{flex:1}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;background:transparent;border-radius:14px;color:var(--ink)}
.iconbtn:hover{background:rgba(0,0,0,.04)}
.demochip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 10px;border-radius:999px;border:1px dashed #A88A5E;background:#FBF4E8;color:var(--amber);font-size:13px;font-weight:700}
.demochip .dot{width:8px;height:8px;border-radius:50%;background:#C98A3E}
#view{padding:8px 16px 24px;max-width:720px;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);height:calc(var(--tabh) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(255,255,255,.96);border-top:1px solid var(--line);backdrop-filter:blur(10px)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:transparent;color:var(--ink3);font-size:12px;font-weight:600}
.tab[aria-current="page"]{color:var(--green)}
.tab svg{width:24px;height:24px}

@media (min-width:960px){
  .app{display:grid;grid-template-columns:280px 1fr}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:28px 20px;border-right:1px solid var(--line);background:var(--surface2);overflow:auto}
  .tabbar{display:none}
  main{padding-bottom:40px}
  .topbar{height:72px;padding:0 40px}
  .topbar .brand,.topbar .demochip{display:none}
  .topbar .ttl{font-size:20px}
  #view{max-width:1100px;padding:8px 40px 48px;margin:0}
  .home-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:start}
  .twocol{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
}
.side .brand{font-family:var(--serif);font-size:24px;font-weight:600;color:var(--green);letter-spacing:.08em}
.side .brand small{display:block;font-family:var(--sans);font-size:12px;color:var(--ink3);letter-spacing:.02em;font-weight:500;margin-top:2px}
.snav{display:flex;flex-direction:column;gap:4px;margin:28px 0}
.snav button{display:flex;align-items:center;gap:12px;height:48px;padding:0 14px;border:0;border-radius:14px;background:transparent;font-weight:600;color:var(--ink2);text-align:left}
.snav button:hover{background:rgba(0,0,0,.04)}
.snav button[aria-current="page"]{background:var(--greenSoft);color:var(--green)}
.snav svg{width:22px;height:22px}
.demopanel{margin-top:auto;border:1px dashed #C7A877;border-radius:16px;padding:14px;background:#FCF7EE}
.demopanel h3{font-size:13px;color:var(--amber);display:flex;align-items:center;gap:6px}
.demopanel p{font-size:12px;color:var(--ink2);line-height:1.6;margin-top:4px}

/* ---------- common ---------- */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.card.flat{box-shadow:none;border:1px solid var(--line);background:var(--surface2)}
.eyebrow{font-size:13px;font-weight:700;color:var(--ink3);letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.h2{font-size:20px;font-weight:700;line-height:1.5}
.sub{color:var(--ink2);font-size:15px}
.small{font-size:13px;color:var(--ink3)}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack>*+*{margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;border:1px solid transparent;font-weight:700;font-size:16px;background:var(--green);color:#fff;transition:transform .12s, background .2s}
.btn:active{transform:scale(.98)}
.btn:hover{background:#234736}
.btn.sec{background:var(--surface);color:var(--green);border-color:var(--line2)}
.btn.sec:hover{background:var(--greenSoft2)}
.btn.ghost{background:transparent;color:var(--green);padding:0 12px}
.btn.ghost:hover{background:var(--greenSoft2)}
.btn.danger{background:var(--surface);color:#9A3B1A;border-color:#E3C6B8}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{border:0;background:none;color:var(--green);font-weight:700;padding:10px 4px;min-height:44px;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.tag{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--greenSoft);color:var(--green);white-space:nowrap}
.tag.amber{background:var(--amberSoft);color:var(--amber)}
.tag.gray{background:#EEEAE2;color:var(--ink2)}
.tag.demo{background:#FBF1E1;color:var(--amber);border:1px dashed #C7A877}
.divider{height:1px;background:var(--line);margin:16px 0}
.fadein{animation:fade .28s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- home ---------- */
.hello{padding:12px 4px 18px}
.hello .date{font-size:14px;color:var(--ink3);font-weight:600}
.hello h1{font-size:28px;margin-top:2px}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:16px}
.mood{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 2px 10px;min-height:88px;border-radius:16px;border:1px solid var(--line);background:var(--surface2);color:var(--ink2);font-size:13px;font-weight:700;transition:background .15s,border-color .15s,color .15s}
.mood:hover{border-color:var(--green2);color:var(--green)}
.mood[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.hero{padding:22px 20px}
.hero .h2{font-size:22px}
.sumgrid{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin-top:14px;font-size:15px}
.sumgrid dt{color:var(--ink3);font-weight:600}
.sumgrid dd{margin:0}
.pending{color:var(--ink3)}
.strip{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:14px}
.strip button{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:transparent;padding:4px 0;border-radius:10px;min-height:52px}
.strip button:hover{background:rgba(0,0,0,.04)}
.strip .wd{font-size:11px;color:var(--ink3);font-weight:600}
.dotm{width:18px;height:18px;border-radius:50%}
.dotm.none{border:1.5px dashed #A79F90;background:transparent}
.strip .today .wd{color:var(--green);font-weight:800}
.strip .today .dotm{box-shadow:0 0 0 3px var(--bg),0 0 0 4.5px var(--green)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px;color:var(--ink3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%}
.progress{height:8px;border-radius:99px;background:#ECE6DA;overflow:hidden;margin-top:10px}
.progress b{display:block;height:100%;background:var(--green2);border-radius:99px}
.exp-card{background:linear-gradient(0deg,var(--surface),var(--surface));border:1px solid #EAD9C2}
.checkrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.opt{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);font-weight:600;font-size:15px;color:var(--ink2);transition:background .15s,border-color .15s}
.opt:hover{border-color:var(--green2)}
.opt[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.opt.sm{min-height:40px;padding:0 10px;font-size:14px}
.welcome-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:18px 0 6px}
.wstep{text-align:center;font-size:12px;color:var(--ink2);font-weight:600}
.wstep b{display:flex;align-items:center;justify-content:center;margin:0 auto 6px;width:40px;height:40px;border-radius:50%;background:var(--greenSoft);color:var(--green);font-size:15px}

/* ---------- log ---------- */
.dayrow{display:flex;align-items:center;gap:14px;width:100%;padding:14px 12px;border:0;border-radius:16px;background:transparent;text-align:left;min-height:64px}
.dayrow:hover{background:rgba(0,0,0,.035)}
.dayrow .d{width:84px;flex:none;font-weight:700;font-size:15px}
.dayrow .d small{display:block;font-weight:500;color:var(--ink3);font-size:12px}
.dayrow .s{flex:1;min-width:0;font-size:14px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gaprow{display:flex;align-items:center;gap:12px;padding:12px;margin:4px 0;border-radius:16px;border:1.5px dashed #CFC7B8;color:var(--ink3);font-size:14px}
.kv{display:grid;grid-template-columns:7.5em 1fr;gap:8px 12px;font-size:15px}
.kv dt{color:var(--ink3);font-weight:600}
.kv dd{margin:0}
.na{color:var(--ink3);font-size:14px;border:1px dashed #BDB4A4;border-radius:8px;padding:0 6px}
.none0{color:var(--green);font-weight:600}

/* ---------- insight ---------- */
.ins-title{font-size:21px;line-height:1.55;margin-top:6px}
.bigq{font-size:24px;line-height:1.55}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--green2)}
.dots i.f{background:var(--green2)}
.dots.b i{border-color:var(--m1)}
.dots.b i.f{background:var(--m1)}
.cmp{display:grid;grid-template-columns:1fr;gap:16px;margin-top:8px}
.cmp .lab{font-weight:700;font-size:15px}
.cmp .num{font-size:14px;color:var(--ink2)}
.sec-h{font-size:16px;font-weight:800;margin:4px 0 8px;display:flex;align-items:center;gap:8px}
.sec-h .n{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--greenSoft);color:var(--green);font-size:13px}
ul.plain{margin:0;padding-left:1.2em}
ul.plain li{margin:4px 0}
.notice{display:flex;gap:10px;padding:12px 14px;border-radius:14px;background:#FBF4E8;border:1px dashed #C7A877;color:#5E4422;font-size:13px;line-height:1.6;margin-bottom:16px}
.bars{display:grid;gap:12px;margin-top:10px}
.bar .t{display:flex;justify-content:space-between;font-size:14px;color:var(--ink2);gap:8px}
.bar .track{height:14px;border-radius:8px;background:#EEE8DC;overflow:hidden;margin-top:4px}
.bar .track b{display:block;height:100%;border-radius:8px;background:#A9B9AE}
.bar.during .track b{background:var(--green2)}
.cand{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:16px;border:1px solid var(--line2);background:var(--surface);margin-bottom:8px;min-height:64px}
.cand[aria-pressed="true"]{border:2px solid var(--green);background:var(--greenSoft2);padding:13px 15px}
.cand b{display:block;font-size:16px}
.cand small{color:var(--ink3);font-size:13px}
.calrow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.cal{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--ink3);gap:3px}
.cal i{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:700}
.cal .done{background:var(--green2);color:#fff}
.cal .part{background:#B9CDBF;color:var(--ink)}
.cal .no{background:#EED9CB;color:#7A3A1C}
.cal .unk{border:1.5px dashed #BDB4A4;color:var(--ink3)}
.cal .fut{background:#F1EDE5;color:#B0A898}
.cal .tdy{outline:2px solid var(--green);outline-offset:2px}

/* ---------- overlay / sheet ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(25,30,27,.38);animation:fade2 .2s ease both}
@keyframes fade2{from{opacity:0}to{opacity:1}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;display:flex;flex-direction:column;max-height:94vh;height:94vh;background:var(--bg);border-radius:24px 24px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.18);animation:up .28s cubic-bezier(.2,.8,.2,1) both}
.sheet.small{height:auto}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (min-width:960px){
  .sheet{left:50%;top:50%;bottom:auto;right:auto;width:640px;height:min(860px,90vh);max-height:90vh;border-radius:24px;transform:translate(-50%,-50%);animation:pop .24s cubic-bezier(.2,.8,.2,1) both}
  .sheet.small{height:auto;width:520px}
  @keyframes pop{from{opacity:0;transform:translate(-50%,-48%) scale(.98)}to{opacity:1;transform:translate(-50%,-50%)}}
}
.sh-head{display:flex;align-items:center;gap:8px;padding:10px 10px 4px 20px}
.sh-head .t{flex:1;font-weight:800;font-size:17px}
.grab{width:40px;height:5px;border-radius:9px;background:#D3CBBD;margin:8px auto 0}
@media (min-width:960px){.grab{display:none}}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px 20px 10px}
.stepb{border:0;background:transparent;padding:6px 0 0;text-align:left;font-size:13px;font-weight:700;color:var(--ink3);min-height:44px}
.stepb i{display:block;height:4px;border-radius:9px;background:#E2DBCD;margin-bottom:6px}
.stepb[aria-current="step"]{color:var(--green)}
.stepb[aria-current="step"] i,.stepb.done i{background:var(--green2)}
.sh-body{flex:1;overflow:auto;padding:6px 20px 24px;-webkit-overflow-scrolling:touch}
.sh-foot{display:flex;gap:10px;align-items:center;padding:12px 20px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface2)}
.sh-foot .sp{flex:1}
.q{margin:18px 0 8px;font-weight:800;font-size:16px;display:flex;align-items:baseline;gap:8px}
.q small{font-weight:600;color:var(--ink3);font-size:13px}
.symrow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.symrow .nm{font-weight:700;font-size:15px}
.symrow .st{display:block;font-size:12px;color:var(--ink3);font-weight:600}
.symrow .seg{flex-wrap:nowrap;gap:4px}
.symrow .opt{min-height:40px;padding:0 9px;font-size:14px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:#ECE6DA;border-radius:14px;padding:4px}
.slot{border:0;background:transparent;border-radius:11px;min-height:44px;font-weight:700;color:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;font-size:15px}
.slot small{font-size:11px;font-weight:600;color:var(--ink3)}
.slot[aria-pressed="true"]{background:var(--surface);color:var(--green);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);font-size:15px;font-weight:600;color:var(--ink)}
.chip:hover{border-color:var(--green2)}
.chip.on{background:var(--greenSoft);border-color:#B7CDBE;color:var(--green)}
.chip .x{display:inline-flex;width:20px;height:20px;align-items:center;justify-content:center;border-radius:50%;background:rgba(44,86,65,.12);font-size:13px}
.plate{width:22px;height:22px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 3px #fff,0 0 0 1px #E0D8C9}
.inrow{display:flex;gap:8px}
.inp{flex:1;min-width:0;height:48px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);padding:0 14px;font-size:16px}
.inp:focus{outline:2px solid #8DB39C;border-color:transparent}
textarea.inp{height:88px;padding:10px 14px;resize:vertical}
.empty-hint{padding:12px 14px;border-radius:12px;background:var(--surface2);border:1px dashed var(--line2);font-size:14px;color:var(--ink2)}
.orow{display:grid;grid-template-columns:7em 1fr;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.orow .lb{font-weight:700;font-size:15px}
.orow .lb small{display:block;font-size:12px;color:var(--ink3);font-weight:600}
@media (max-width:420px){.orow{grid-template-columns:1fr}}
.weather{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink2)}
.dialog{padding:22px 22px 18px}
.dialog .h2{font-size:18px}
.dialog p{margin-top:8px;color:var(--ink2);font-size:15px}
.dialog .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}

/* demo sheet */
.scn{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:14px;border:1px solid var(--line2);border-radius:16px;background:var(--surface);margin-bottom:8px}
.scn[aria-pressed="true"]{border:2px solid var(--amber);padding:13px;background:#FFFBF4}
.scn b{display:block;font-size:15px}
.scn small{display:block;font-size:13px;color:var(--ink3);line-height:1.5}
.scn .rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);flex:none;margin-top:2px}
.scn[aria-pressed="true"] .rd{border:6px solid var(--amber)}
.sidescn{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.sidescn button{display:flex;align-items:center;gap:8px;text-align:left;border:0;background:transparent;border-radius:10px;padding:8px;font-size:13px;font-weight:600;color:var(--ink2);min-height:40px}
.sidescn button:hover{background:rgba(0,0,0,.04)}
.sidescn button[aria-pressed="true"]{background:#F4E4CC;color:#5E3A12}
.sidescn .rd{width:14px;height:14px;border-radius:50%;border:2px solid #C7A877;flex:none}
.sidescn button[aria-pressed="true"] .rd{border:4px solid var(--amber)}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);z-index:60;display:none;align-items:center;gap:6px;max-width:calc(100vw - 24px);padding:6px 6px 6px 18px;border-radius:16px;background:#22302A;color:#fff;font-size:15px;box-shadow:0 8px 28px rgba(0,0,0,.25)}
#toast.show{display:flex;animation:toastin .22s ease both}
@keyframes toastin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

<script>
"use strict";
/* =========================================================
   からだ日和 — 触れるモックアップ（デモ）
   ・架空データのみ。外部送信なし。保存はこのブラウザ内（デモ用）だけ。
   ・表示する「気づき」はデモ用シナリオ。医学的分析ではありません。
   ========================================================= */
const APP_VERSION = '1.0.0（初期版候補）';
const SCHEMA = 1;                 // 記録の形の版。形を変えるときは MIGRATIONS に変換を足す
const AUTO_CLASSIFY = false;      // 比較の自動分類・気づきの自動表示（検証が済むまで無効）
const DEMO_TODAY = '2026-11-22';
const TZ = 'Asia/Tokyo';          // 日付の区切り：日本時間の午前0時
function jstToday(){ return new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()); }
function jstHour(){ return +new Intl.DateTimeFormat('en-US',{timeZone:TZ,hour:'numeric',hourCycle:'h23'}).format(new Date()); }
let MODE = 'real';                // 'real'＝本人の記録 / 'demo'＝架空データ
let TODAY = jstToday();
const WD = '日月火水木金土';
const pad = n => String(n).padStart(2,'0');
const toISO = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dt = iso => new Date(iso+'T00:00:00');
const addDays = (iso,n) => { const d=dt(iso); d.setDate(d.getDate()+n); return toISO(d); };
const diffDays = (a,b) => Math.round((dt(a)-dt(b))/864e5);
const jp = iso => { const d=dt(iso); return `${d.getMonth()+1}月${d.getDate()}日（${WD[d.getDay()]}）`; };
const md = iso => { const d=dt(iso); return `${d.getMonth()+1}/${d.getDate()}`; };
const wd = iso => WD[dt(iso).getDay()];
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const clone = o => JSON.parse(JSON.stringify(o));
const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ---------- 語彙 ---------- */
const MOODS = ['','つらい','いまいち','ふつう','よい','とてもよい'];
const MOODC = ['','var(--m1)','var(--m2)','var(--m3)','var(--m4)','var(--m5)'];
const WAKE = {good:'すっきり',ok:'ふつう',tired:'だるい'};
const SYMS = [['shoulder','肩こり'],['tired','疲れ・だるさ'],['nose','鼻づまり'],['skin','肌のかゆみ・荒れ'],['voice','声の出しづらさ']];
const SHORT = {shoulder:'肩こり',tired:'疲れ',nose:'鼻',skin:'肌',voice:'声'};
const WHEN = ['朝','日中','夜'];
const SYML = Object.fromEntries(SYMS);
const LV = ['なし','軽い','中','強い'];
const SLOTS = [['b','朝'],['l','昼'],['d','夜'],['s','間食']];
const SLOTL = Object.fromEntries(SLOTS);
const DTIMES = [['18:45','〜19時'],['19:30','19〜20時'],['20:30','20〜21時'],['21:30','21時以降']];
const dtLabel = t => { if(!t) return null; const f=DTIMES.find(x=>x[0]===t); if(f) return f[1]; return t<'19:00'?'〜19時':t<'20:00'?'19〜20時':t<'21:00'?'20〜21時':'21時以降'; };
const TAGS = ['甘いもの','お酒','揚げ物・脂っこい','麺・パン','乳製品'];
const SLEEP = [[4.5,'5時間未満'],[5.5,'5〜6時間'],[6.5,'6〜7時間'],[7.5,'7時間以上']];
const sleepLabel = v => (SLEEP.find(x=>x[0]===v)||[0,'—'])[1];
const LMH = {low:'軽い',mid:'ふつう',high:'重い'};
const ACT = {low:'少ない',mid:'ふつう',high:'多い'};
const MEDS = ['塗り薬','点鼻薬','飲み薬','その他'];
const WATCH = {wake:'朝の目覚め',mood:'全体の調子',shoulder:'肩こり',tired:'疲れ・だるさ',nose:'鼻づまり',skin:'肌のかゆみ・荒れ',voice:'声の出しづらさ'};
const CHECK = {done:'できた',part:'少し',no:'できなかった'};
const VERDICT = {better:'よくなった気がする',same:'変わらない・分からない',worse:'悪くなった気がする'};
const WEATHERS = [['sun','晴れ'],['cloud','くもり'],['rain','雨']];
const PLATE = {}; const PLATEC=['#E9D8B8','#D9C3A0','#C9D8BF','#E8C7A8','#D7DCCB','#EBDCC9','#CFC0A4','#E3CFB9'];
const plateColor = name => { if(PLATE[name]) return PLATE[name]; let h=0; for(const c of name) h=(h*31+c.charCodeAt(0))>>>0; return PLATE[name]=PLATEC[h%PLATEC.length]; };

/* ---------- 架空データ生成 ---------- */
const MB=['ごはんと味噌汁','納豆ごはん','トーストとコーヒー','ヨーグルトとバナナ'];
const ML=['社食の定食','コンビニのおにぎり','ざるそば','ラーメン','日替わり弁当'];
const MD=['焼き魚定食','鶏むね肉と野菜炒め','カレーライス','湯豆腐と鍋','パスタ','居酒屋で外食'];
const MS=['チョコレート','せんべい','菓子パン','ナッツ'];
const MEMOS=['会議が長引いた','外が寒かった','よく眠れた気がする','夕方に肩が重かった','早めに帰れた','残業で遅くなった'];
function blankRec(){ return {mood:null,wake:null,sym:{shoulder:null,tired:null,nose:null,skin:null,voice:null},tiredWhen:[],meals:{b:{items:[],none:false},l:{items:[],none:false},d:{items:[],none:false},s:{items:[],none:false}},dinnerTime:null,tags:[],tagsNo:[],sleep:null,stress:null,activity:null,posture:null,seitai:null,meds:[],medsNone:false,weight:'',memo:'',savedAt:null}; }
function demoWeather(date){ const r=rng(parseInt(date.replace(/-/g,''),10)); const w=WEATHERS[Math.floor(r()*3)]; const t=Math.round(8+r()*9), pr=r()<.3?'低め':'ふつう'; const hr=r(); return {i:w[0],l:w[1],t,p:pr,h:w[0]==='rain'?'高め':hr<.32?'乾燥':hr<.85?'ふつう':'高め'}; }
function genDays(seed,fromAgo,toAgo,o={}){
  const r=rng(seed), days={}; let flare=0; let prev={early:r()<.5,stress:'mid',sweets:false};
  const P=(k,d)=>o[k]!==undefined?o[k]:d;
  for(let a=fromAgo;a>=toAgo;a--){
    const date=addDays(TODAY,-a), dw=dt(date).getDay(), wkend=dw===0||dw===6;
    const stress = wkend ? (r()<.7?'low':'mid') : (r()<.3?'high':r()<.55?'mid':'low');
    const early = r() < (stress==='high'?.25:.62);
    let sleep = 6.0 + (prev.early?.65:0) + (wkend?.35:0) + (r()-.5)*1.5;
    const sb = sleep<5?4.5:sleep<6?5.5:sleep<7?6.5:7.5;
    const sc = (prev.early?.75:0) + (sleep-6.5)*.5 + (prev.stress==='high'?-.45:0) + (r()-.5)*2.1;
    let wake = sc>.6?'good':sc<-.05?'tired':'ok';
    if(r()<.2) wake = r()<.5?'good':'tired'; // 説明のつかない体調の波
    const postureP = o.postureP ? o.postureP(date) : .5;
    const posture = r()<postureP;
    const shoulder = clamp(Math.round(1.9-(posture?.95:0)+(stress==='high'?.5:0)+(r()-.5)*1.4),0,3);
    const sweetsP = (o.expSweets && date>=o.expSweets) ? .12 : .42;
    const sweets = r()<sweetsP;
    const nose = clamp(Math.round(.7+(prev.sweets?.9:0)+(r()-.5)*1.4),0,3);
    const voice = clamp(Math.round(1.0+(sweets?.8:0)+(r()-.5)*1.3),0,3);
    const fatigue = clamp(Math.round(1.6-(sc*.5)+(r()-.5)*1.2),0,3);
    const dull = wake==='tired'?clamp(Math.round(2+(r()-.5)),1,3):wake==='good'?(r()<.7?0:1):clamp(Math.round(1+(r()-.5)),0,2);
    r(); // （旧：肌の値。乱数の並びを保つため残す）
    const r3=rng(seed*104729+a*13+3);
    const dryRecent=[0,1,2].some(k=>demoWeather(addDays(date,-k)).h==='乾燥');
    if(flare>0) flare--; else if(r3()<.07) flare=3+Math.floor(r3()*3);
    const skin = clamp(Math.round(.6+(dryRecent?.8:0)+(flare>0?1.2:0)+(r3()-.5)*1.3),0,3);
    const tired = clamp(Math.round(.75+(sb<6?.8:0)+(stress==='high'?.6:0)+(prev.stress==='high'?.3:0)-sc*.15+(r3()-.5)*1.7),0,3);
    const recorded = r() < P('recP',.93);
    const thisPrev = prev; prev={early,stress,sweets};
    if(!recorded) continue;
    const rec=blankRec();
    rec.mood = clamp(Math.round(3+sc*.8-shoulder*.25+(r()-.5)*.9),1,5);
    if(r()<P('wakeP',.92)) rec.wake=wake;
    const s=rec.sym;
    if(r()<.92) s.shoulder=shoulder; const rt1=r(); r(); if(rt1<P('tiredP',.85)) s.tired=tired;
    if(s.tired>=1 && r3()<.5) rec.tiredWhen=[WHEN[Math.floor(r3()*3)]];
    if(r()<P('noseP',.3)) s.nose=nose; if(r()<P('skinP',.75)) s.skin=skin; if(r()<.65) s.voice=voice;
    if(r()<P('mealP',.88)) rec.meals.b.items=[MB[Math.floor(r()*MB.length)]];
    if(r()<P('mealP',.85)) rec.meals.l.items=[ML[Math.floor(r()*ML.length)]];
    if(r()<P('dinnerP',.88)){ const dn=MD[Math.floor(r()*MD.length)]; rec.meals.d.items=[dn];
      rec.dinnerTime = early ? (r()<.4?'18:45':'19:30') : (r()<.6?'20:30':'21:30'); }
    if(sweets){ rec.meals.s.items=[r()<.6?'チョコレート':'菓子パン']; } else if(r()<.25){ rec.meals.s.items=[r()<.5?'せんべい':'ナッツ']; }
    const all=[...rec.meals.b.items,...rec.meals.l.items,...rec.meals.d.items,...rec.meals.s.items].join(' ');
    if(sweets) rec.tags.push('甘いもの');
    if(/居酒屋/.test(all)){ rec.tags.push('お酒'); if(r()<.6) rec.tags.push('揚げ物・脂っこい'); }
    if(/ラーメン|パスタ|トースト|菓子パン|そば/.test(all)) rec.tags.push('麺・パン');
    if(/ヨーグルト/.test(all)) rec.tags.push('乳製品');
    { const r2=rng(seed*7919+a); for(const t of TAGS) if(!rec.tags.includes(t) && r2()<(t==='甘いもの'?.5:.3)) rec.tagsNo.push(t); } // 「なかった」と明示した日だけ記録（残りは未記録）
    if(r()<.88) rec.sleep=sb; if(r()<.75) rec.stress=stress; if(r()<.5) rec.activity=['low','mid','high'][Math.floor(r()*3)];
    if(r()<.75) rec.posture=posture; if(dw===6) rec.seitai=true;

function emptyState(){ return {days:{},history:{b:{},l:{},d:{},s:{}},experiments:[],plans:[],draft:null,welcomeSeen:false,prefs:{}}; }
function idbOpen(name){ return new Promise((res,rej)=>{ const q=indexedDB.open(name,1);
  q.onupgradeneeded=()=>{ const db=q.result; if(!db.objectStoreNames.contains('kv')) db.createObjectStore('kv'); if(!db.objectStoreNames.contains('weather')) db.createObjectStore('weather'); if(!db.objectStoreNames.contains('snapshots')) db.createObjectStore('snapshots',{keyPath:'id',autoIncrement:true}); };
  q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); q.onblocked=()=>rej(new Error('blocked')); }); }
function idbReq(r){ return new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function txDone(tx){ return new Promise((res,rej)=>{ tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error||new Error('abort')); }); }
function kvGet(k){ return idbReq(R.db.transaction('kv').objectStore('kv').get(k)); }

async function addSnapshot(reason,state,schema){ const tx=R.db.transaction('snapshots','readwrite'); tx.objectStore('snapshots').add({at:new Date().toISOString(),reason,schema:schema||SCHEMA,state:clone(state)}); await txDone(tx);
  const all=await listSnapshots(); const extra=all.length-10; if(extra>0){ const tx2=R.db.transaction('snapshots','readwrite'); all.slice(0,extra).forEach(x=>tx2.objectStore('snapshots').delete(x.id)); await txDone(tx2); } }
async function migrateIfNeeded(){
  if(R.meta.schema>SCHEMA){ R.readOnly='newer'; return; }
  if(R.meta.schema===SCHEMA) return;
  await addSnapshot(`更新の直前（版${R.meta.schema}）`,R.state,R.meta.schema);
  try{ let st=clone(R.state); for(let v=R.meta.schema; v<SCHEMA; v++){ const f=MIGRATIONS[v]; if(!f) throw new Error(`版${v}から版${v+1}への変換がありません`); st=f(st); }
    const meta={...R.meta,schema:SCHEMA,migratedAt:new Date().toISOString()}; await kvPut({state:st,meta}); R.state=st; R.meta=meta;
  }catch(e){ R.readOnly='migrate'; R.migrateError=String(e&&e.message||e); } }

  if(!R.state) R.state=emptyState();
  await migrateIfNeeded();
  const tx=R.db.transaction('weather'); const ws=tx.objectStore('weather'); const [vals,keys]=await Promise.all([idbReq(ws.getAll()),idbReq(ws.getAllKeys())]); keys.forEach((k,i)=>R.weather[k]=vals[i]);
  if(!R.readOnly && R.meta.role==='main' && Object.keys(R.state.days).length){ const all=await listSnapshots(); const last=[...all].reverse().find(x=>x.reason==='日ごとの自動の写し'); if(!last||last.at.slice(0,10)!==new Date().toISOString().slice(0,10)) await addSnapshot('日ごとの自動の写し',R.state); }

   facLabel:'前日に甘いものを食べた', facMissing:'前日の甘いものが未記録（前日自体の未記録を含む）', tryIdx:1}
];
function analyze(st,q){
  const win=[]; for(let i=29;i>=1;i--) win.push(addDays(TODAY,-i)); if(st.days[TODAY]) win.push(TODAY);
  const rec=win.filter(d=>st.days[d]);
  const A=[],B=[]; let M=0,noOut=0,noFac=0; const all=[];
  for(const d of rec){ const r=st.days[d]; const o=q.out(r); if(o==null){noOut++;continue;}
    const f=q.fac(d,st.days); if(f==null){noFac++;continue;}
    const p=st.days[addDays(d,-1)];
    const it={d,f,sleep:r.sleep,stress:(q.id==='shoulder'?r.stress:(p&&p.stress))||null,wk:[0,6].includes(dt(d).getDay())};
    all.push(it); if(o==='A')A.push(it); else if(o==='B')B.push(it); else M++; }
  const rate=g=>g.length?g.filter(x=>x.f).length/g.length:0;
  const ra=rate(A), rb=rate(B);
  let status = !rec.length ? 'empty' : (A.length<MIN_N||B.length<MIN_N) ? 'insufficient' : Math.abs(ra-rb)<.25 ? 'nodiff' : 'found';
  return {q,win,rec,A,B,M,noOut,noFac,ra,rb,status,all,from:win[0],to:win[win.length-1]};
}
function insightTitle(a){ const q=a.q;
  if(a.status==='found') return q.titleFound;
  if(a.status==='nodiff') return `${q.short}：はっきりした違いは見られません`;
  return `${q.short}：まだ比較できません`; }
function insightLead(a){ const q=a.q;
  if(a.status==='found') return `${q.Alabel}は、「${q.facLabel}」日が${a.ra>a.rb?'多め':'少なめ'}でした。`;
  if(a.status==='nodiff') return `比べてみましたが、「${q.facLabel}」の割合に大きな差はありませんでした。`;
  if(a.status==='empty') return '記録がまだありません。記録が増えると、ここで比べられるようになります。';
  return `比べるための記録がまだ足りません。`; }
function insufficientReasons(a){ const q=a.q, out=[];
  out.push(`直近29日のうち、記録のある日：${a.rec.length}日`);
  out.push(`${q.Alabel}：${a.A.length}日（目安 ${MIN_N}日以上）`);
  out.push(`${q.Blabel}：${a.B.length}日（目安 ${MIN_N}日以上）`);
  if(a.noOut) out.push(`記録はあるが「${q.outName}」が未記録の日：${a.noOut}日`);
  if(a.noFac) out.push(`${q.facMissing}の日：${a.noFac}日`);

function allAnalyses(st){ const order={found:0,nodiff:1,insufficient:2,empty:3}; return QUESTIONS.map(q=>analyze(st,q)).sort((x,y)=>order[x.status]-order[y.status]); }

function recentCard(st){

function expMini(st,e){
  const c=e.check[TODAY]; const d=expDay(e); const ended=TODAY>expEnd(e);
  const missing=[]; for(let x=e.start;x<TODAY&&x<=expEnd(e);x=addDays(x,1)) if(!e.check[x]) missing.push(x);
  return `<div class="card exp-card"><div class="between"><div class="eyebrow" style="color:var(--amber)">${I.leaf} 取り組み中</div><span class="small">${d}日目 / ${e.days}日</span></div>
  <h3 class="h2" style="margin-top:4px">${esc(e.title)}</h3>
  <div class="progress"><b style="width:${d/e.days*100}%;background:#B07A45"></b></div>
  <p class="sub" style="margin-top:12px">今日はできましたか？</p>
  <div class="checkrow">${Object.entries(CHECK).map(([k,l])=>`<button class="opt" data-a="expCheck" data-id="${e.id}" data-v="${k}" aria-pressed="${c===k}">${l}</button>`).join('')}</div>
  ${missing.length>=2?`<p class="small" style="margin-top:10px">記録のない日が${missing.length}日あります。振り返りでは「未記録」として扱います。</p>`:''}
  <button class="link" data-a="exp" data-id="${e.id}">${ended?'振り返る':'経過を見る'}</button></div>`;
}

/* ---------- 記録一覧 ---------- */
VIEWS.log=()=>{
  const st=S(); const first=Object.keys(st.days).sort()[0];
  const from = first ? (diffDays(TODAY,first)>29?addDays(TODAY,-29):first) : TODAY;
  const ds=[]; for(let d=TODAY; d>=from; d=addDays(d,-1)) ds.push(d);
  let html=''; let i=0;
  while(i<ds.length){
    const d=ds[i]; const r=st.days[d];
    if(r){ html+=dayRow(d,r); i++; continue; }
    if(d===TODAY){ html+=`<button class="dayrow" data-a="openRec" data-date="${d}"><span class="d">今日<small>${md(d)}（${wd(d)}）</small></span><span class="dotm none"></span><span class="s">まだ記録していません</span><span class="tag">記録する</span></button>`; i++; continue; }
    let j=i; while(j<ds.length && !st.days[ds[j]] && ds[j]!==TODAY) j++;
    const n=j-i; const a=ds[j-1], b=ds[i];
    html+= n===1
      ? `<button class="dayrow" data-a="day" data-date="${d}"><span class="d">${md(d)}<small>${wd(d)}曜</small></span><span class="dotm none"></span><span class="s" style="color:var(--ink3)">未記録</span></button>`
      : `<div class="gaprow"><span class="dotm none" style="width:14px;height:14px"></span><span style="flex:1">${md(a)}〜${md(b)}　未記録（${n}日）</span><button class="link" style="padding:4px;font-size:14px" data-a="day" data-date="${b}">さかのぼる（任意）</button></div>`;
    i=j;
  }
  if(!first) html+=`<div class="empty-hint" style="margin-top:12px">記録はまだありません。今日の分から始められます。</div>`;
  return `<div class="hello"><h1 class="serif">記録</h1><p class="sub">直近30日。空いた日は「未記録」として扱い、「症状なし」とは区別しています。</p></div><div class="card" style="padding:8px">${html}</div>`;
};
function dayRow(d,r){
  const sy=SYMS.filter(([k])=>r.sym[k]>=2).map(([,l])=>l);
  const meals=SLOTS.map(([k])=>mealText(r,k)).filter(Boolean).length;
  const s=[r.mood?MOODS[r.mood]:'調子は未記録', r.wake?`目覚め${WAKE[r.wake]}`:null, sy.length?sy.join('・')+'が気になる':null, `食事${meals}件`].filter(Boolean).join('　');
  return `<button class="dayrow" data-a="day" data-date="${d}"><span class="d">${d===TODAY?'今日':md(d)}<small>${d===TODAY?md(d)+'（'+wd(d)+'）':wd(d)+'曜'}</small></span><span class="dotm" style="background:${r.mood?MOODC[r.mood]:'#B9C7BD'}"></span><span class="s">${esc(s)}</span>${I.chev}</button>`;
}

  <div class="twocol"><div>
  <div class="card"><div class="eyebrow">体調</div><dl class="kv" style="margin-top:10px">

    ${TAGS.map(t=>{const ts=tagState(r,t); return `<dt>${t}</dt><dd>${ts==='yes'?'あった':ts==='no'?'<span class="none0">なかった</span>':un}</dd>`;}).join('')}</dl></div></div><div>

    <dt>活動</dt><dd>${r.activity?ACT[r.activity]:un}</dd><dt>姿勢ケア</dt><dd>${r.posture===null?un:r.posture?'した':'していない'}</dd>
    <dt>整体</dt><dd>${r.seitai?'行った':un}</dd><dt>薬・塗り薬</dt><dd>${r.meds.length?esc(r.meds.join('、')):r.medsNone?'使っていない':un}</dd>
    <dt>体重</dt><dd>${r.weight?esc(r.weight)+' kg':un}</dd>${ex?`<dt>取り組み</dt><dd>${esc(ex.title)}：${CHECK[ex.check[date]]}</dd>`:''}
    ${r.memo?`<dt>メモ</dt><dd>${esc(r.memo)}</dd>`:''}</dl></div>

VIEWS.insights=()=>{
  const st=S();
  if(!AUTO_CLASSIFY) return `<div class="hello"><h1 class="serif">振り返り</h1><p class="sub">記録した日の前後を並べて見られます。</p></div>

    ${lookEntry(st)}`;

  <div class="notice">${I.info}<div><b>デモ表示です。</b>架空データでの表示例で、実際の分析機能が動いた結果ではありません。医学的な判断でもありません。</div></div>

  <div class="twocol">${a.map(x=>insightCard(x)).join('')}</div>

function insightCard(a){

  ${a.status==='insufficient'||a.status==='empty'?`<div class="progress"><b style="width:${got/(MIN_N*2)*100}%"></b></div><p class="small" style="margin-top:6px">比べる材料 ${got} / ${MIN_N*2}</p>`:''}
  <button class="btn sec block" style="margin-top:14px" data-a="insight" data-id="${a.q.id}">${a.status==='found'?'根拠と、当てはまらない日を見る':'理由を見る'} ${I.chev}</button></div>`;
}
VIEWS.insight=({id})=>{
  const st=S(); const q=QUESTIONS.find(x=>x.id===id); const a=analyze(st,q);
  const head=`<div class="notice">${I.info}<div><b>デモシナリオ：</b>架空データで集計した表示例です。実際の分析結果ではなく、医学的な判断でもありません。</div></div>
    <div class="hello" style="padding-top:0"><span class="small">${esc(q.q)}</span><h1 class="serif ins-title" style="font-size:24px">${insightTitle(a)}</h1>
    <p class="sub" style="margin-top:6px">${esc(insightLead(a))}</p></div>`;
  if(a.status==='insufficient'||a.status==='empty'){
    return head+`<div class="card"><div class="sec-h">なぜ、まだ比較できないのか</div><ul class="plain">${insufficientReasons(a).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    <p class="small" style="margin-top:10px">件数が少ないまま比べると、偶然の偏りを「傾向」と取り違えやすくなります。そのため、ここでは発見を表示しません。</p></div>
    <div class="card flat"><div class="sec-h">記録が増えると見られること</div><p class="sub">${esc(q.Alabel)}と${esc(q.Blabel)}で、「${esc(q.facLabel)}」の割合を比べます。毎日でなくても、記録した日が増えれば比べられます。</p>
    ${q.id==='wake'?'<p class="small" style="margin-top:8px">朝の目覚めは、記録の1問目でひと押しするだけで残せます。夕食の時刻は「夜」の欄でおおまかに選べます。</p>':''}</div>`;
  }
  const n=x=>x.length;
  const fa=a.A.filter(x=>x.f).length, fb=a.B.filter(x=>x.f).length;
  const dots=(g,cls)=>`<div class="dots ${cls}" aria-hidden="true">${g.map(x=>`<i class="${x.f?'f':''}" title="${md(x.d)}"></i>`).join('')}</div>`;
  const misA=a.A.filter(x=>!x.f), misB=a.B.filter(x=>x.f);
  const note=x=>{const r=st.days[x.d]; const p=[]; if(x.sleep) p.push('睡眠'+sleepLabel(x.sleep)); if(x.stress) p.push((q.id==='shoulder'?'':'前日の')+'仕事'+LMH[x.stress]); if(r&&r.memo) p.push('メモ「'+r.memo+'」'); return p.join('・')||'—';};
  const sl=g=>{const v=g.map(x=>x.sleep).filter(Boolean); return v.length?avg(v):null;};
  const sA=sl(a.A), sB=sl(a.B);
  const stA=a.A.filter(x=>x.stress==='high').length/Math.max(1,a.A.filter(x=>x.stress).length), stB=a.B.filter(x=>x.stress==='high').length/Math.max(1,a.B.filter(x=>x.stress).length);
  const wkA=a.A.filter(x=>x.wk).length/n(a.A), wkB=a.B.filter(x=>x.wk).length/n(a.B);
  const alt=[];
  if(sA&&sB) alt.push(Math.abs(sA-sB)>=.4 ? `睡眠：${q.Alabel}は平均${sA.toFixed(1)}時間、${q.Blabel}は${sB.toFixed(1)}時間でした。睡眠の長さが関わっている可能性もあり、記録上は区別できません。` : `睡眠：平均${sA.toFixed(1)}時間と${sB.toFixed(1)}時間で、大きな差はありませんでした。`);
  if(Math.abs(stA-stB)>=.15) alt.push(`仕事の重さ：${q.id==='shoulder'?'その日':'前日'}の仕事が「重い」だった割合は、${Math.round(stA*100)}% と ${Math.round(stB*100)}% でした。忙しい日は${q.id==='wake'?'夕食も遅くなりやすく':'ケアの余裕もなく'}、両方が重なっているかもしれません。`);
  if(Math.abs(wkA-wkB)>=.15) alt.push(`曜日：休日の割合が ${Math.round(wkA*100)}% と ${Math.round(wkB*100)}% で異なります。休日かどうかの影響も考えられます。`);
  alt.push('天候や季節、体調の波そのものなど、記録していない要因の可能性もあります。');
  if(q.id==='wake'){ const e=a.all.filter(x=>x.f&&x.sleep), l=a.all.filter(x=>!x.f&&x.sleep); if(e.length&&l.length&&avg(e.map(x=>x.sleep))-avg(l.map(x=>x.sleep))>=.3) alt.unshift(`夕食が早かった翌朝は、睡眠も長め（平均${avg(e.map(x=>x.sleep)).toFixed(1)}時間 / 遅かった翌朝 ${avg(l.map(x=>x.sleep)).toFixed(1)}時間）でした。夕食の時刻と睡眠のどちらが効いているかは、まだ分かりません。`); }
  const cand=CANDS[q.tryIdx];
  const unk=['これが原因なのか、たまたま重なっただけなのか','約1か月分の記録のため、季節や仕事の時期による違い'];
  if(q.id==='wake') unk.push('夕食の時刻と、夕食の中身・量のどちらが関わるのか');
  if(q.id==='nose') unk.push('甘いものの種類や量による違い');
  unk.push('件数が少ないため、数日分の記録で結果が変わりうること');
  const open=ui.insOpen||{};
  const sec=(key,num,title,preview,body)=>`<details class="acc" data-k="${key}" ${open[key]?'open':''}><summary><span class="n">${num}</span><span class="acc-t"><b>${title}</b><span class="small">${preview}</span></span><span class="chev" aria-hidden="true">${I.chev}</span></summary><div class="acc-b">${body}</div></details>`;
  const b1=`<p class="sub">${md(a.from)}〜${md(a.to)}の${a.win.length}日のうち、記録のある${a.rec.length}日を見ました。</p>
    <div class="cmp">
      <div><div class="lab">${esc(q.Alabel)}　${n(a.A)}日</div>${dots(a.A,'')}<div class="num" style="margin-top:4px">「${esc(q.facLabel)}」は <b>${fa}日 / ${n(a.A)}日（${Math.round(a.ra*100)}%）</b></div></div>
      <div><div class="lab">${esc(q.Blabel)}　${n(a.B)}日</div>${dots(a.B,'b')}<div class="num" style="margin-top:4px">「${esc(q.facLabel)}」は <b>${fb}日 / ${n(a.B)}日（${Math.round(a.rb*100)}%）</b></div></div>
    </div><p class="small" style="margin-top:10px">● 塗りつぶし＝${esc(q.facLabel)}　○ 白抜き＝そうでない日</p>`;
  const b2=`<ul class="plain"><li>比較：${esc(q.Alabel)}（${n(a.A)}日）と ${esc(q.Blabel)}（${n(a.B)}日）</li>
    ${a.M?`<li>${esc(q.midLabel)}（${a.M}日）は比較から外しました</li>`:''}
    ${a.noOut?`<li>「${esc(q.outName)}」が未記録の日（${a.noOut}日）は含めていません</li>`:''}
    ${a.noFac?`<li>${esc(q.facMissing)}の日（${a.noFac}日）は含めていません</li>`:''}
    <li>未記録を「症状なし」や「食べなかった」としては数えていません</li></ul>`;
  const b3=(misA.length||misB.length)?`<ul class="plain">${misA.slice(0,4).map(x=>`<li>${md(x.d)}（${wd(x.d)}）：${esc(q.Alabel.replace('の日',''))}なのに、${esc(q.facLabel)}ではなかった<br><span class="small">${esc(note(x))}</span></li>`).join('')}${misB.slice(0,4).map(x=>`<li>${md(x.d)}（${wd(x.d)}）：${esc(q.facLabel)}だったのに、${esc(q.Blabel.replace('の日',''))}<br><span class="small">${esc(note(x))}</span></li>`).join('')}</ul>${misA.length+misB.length>8?`<p class="small" style="margin-top:6px">ほか${misA.length+misB.length-8}日</p>`:''}`:'<p class="sub">今回の期間では見当たりませんでした。</p>';
  const b4=`<ul class="plain">${alt.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  const b5=`<ul class="plain">${unk.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  const keys=['ev','cnt','mis','alt','unk']; const allOpen=keys.every(k=>open[k]);
  return head+`<div class="ins-layout"><div>
  <div class="card keyfacts"><div class="eyebrow">ひと目で</div>
    <div class="kf">
      <div><span class="small">${esc(q.Alabel)}</span><b class="serif">${fa}<small> / ${n(a.A)}日</small></b><span class="small">が「${esc(q.facLabel)}」</span></div>
      <div><span class="small">${esc(q.Blabel)}</span><b class="serif">${fb}<small> / ${n(a.B)}日</small></b><span class="small">が「${esc(q.facLabel)}」</span></div>
    </div>
    <p class="small" style="margin-top:10px">手がかりの強さ：<b>弱い</b>　件数が少なく、偶然の可能性があります。原因とは限りません。</p></div>
  <div class="between" style="margin:20px 4px 6px"><span class="eyebrow">くわしく見る（タップで開く）</span><button class="link" style="font-size:14px" data-a="insAll">${allOpen?'すべて閉じる':'すべて開く'}</button></div>
  <div class="card acc-wrap">
    ${sec('ev',1,'根拠になった記録',`${esc(q.Alabel)} ${n(a.A)}日と、${esc(q.Blabel)} ${n(a.B)}日`,b1)}
    ${sec('cnt',2,'比べたものと件数',`記録のある${a.rec.length}日のうち${n(a.A)+n(a.B)}日で比較、${a.M+a.noOut+a.noFac}日は除外`,b2)}
    ${sec('mis',3,'当てはまらない日',(misA.length+misB.length)?`${misA.length+misB.length}日あります`:'見当たりません',b3)}
    ${sec('alt',4,'別の説明の可能性',`${alt.length}つ（睡眠・仕事量など）`,b4)}
    ${sec('unk',5,'まだ分からないこと',`${unk.length}つ`,b5)}
  </div></div><div>
  <div class="card exp-card"><div class="eyebrow" style="color:var(--amber)">${I.leaf} 確かめるなら</div>
    <p class="sub" style="margin-top:6px">負担の小さい形で、一つだけ試して前後を振り返る方法があります。試すかどうかは自由です。</p>
    <p style="margin-top:8px;font-weight:700">例：${esc(cand.title)}</p>
    <div class="row" style="margin-top:14px;flex-wrap:wrap"><button class="btn" data-a="tryFrom" data-i="${q.tryIdx}">これを試してみる</button><button class="btn ghost" data-a="back">今はやめておく</button></div></div>
  </div></div>`;
};

/* ---- バックアップ ---- */
async function sha256(str){ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
async function makeBackup(){ const st=R.state; const data={days:st.days,history:st.history,experiments:st.experiments,plans:st.plans,prefs:st.prefs};
  const body=JSON.stringify({data,weather:R.weather}); const ks=Object.keys(st.days).sort();
  return {format:'karada-biyori-backup',kind:'real',schema:SCHEMA,appVersion:APP_VERSION,exportedAt:new Date().toISOString(),summary:{days:ks.length,from:ks[0]||null,to:ks[ks.length-1]||null},checksum:await sha256(body),body}; }
async function exportBackup(){ if(!canWrite()) return toast('この端末では書き出せません');
  const b=await makeBackup(); const name=`karada-backup-${TODAY}.json`; const file=new File([JSON.stringify(b)],name,{type:'application/json'});
  let done=false;
  if(/iPhone|iPad|iPod/.test(navigator.userAgent) && navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file],title:'からだ日和のバックアップ'}); done=true; }catch(e){ if(e&&e.name==='AbortError'){ toast('書き出しを取りやめました'); return; } } }
  if(!done){ const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },2000); }
  R.meta.lastBackupAt=new Date().toISOString(); await saveMeta(); render(); toast(`バックアップを書き出しました（${b.summary.days}日分）`); return b; }
async function readBackupText(text){
  let o; try{ o=JSON.parse(text); }catch(e){ throw new Error('ファイルを読み取れませんでした（形式が違います）'); }
  if(!o||o.format!=='karada-biyori-backup') throw new Error('からだ日和のバックアップファイルではありません');
  if(o.kind!=='real') throw new Error('デモのデータは読み込めません');
  if(typeof o.schema!=='number'||o.schema>SCHEMA) throw new Error('新しい版のアプリで作られたファイルです。アプリを更新してから読み込んでください');
  if(typeof o.body!=='string'||await sha256(o.body)!==o.checksum) throw new Error('ファイルが壊れているか、途中で書き換えられています');
  const p=JSON.parse(o.body); if(!p.data||typeof p.data.days!=='object') throw new Error('記録が見つかりません');
  let data=p.data; for(let v=o.schema; v<SCHEMA; v++){ const f=MIGRATIONS[v]; if(!f) throw new Error(`版${v}のファイルを変換できません`); data=f(data); }
  return {head:o,data,weather:p.weather||{}}; }
let pendingImport=null;
async function onFileChosen(file){ if(!file) return;
  try{ const r=await readBackupText(await file.text()); pendingImport=r; const h=r.head, sm=h.summary||{};
    const cur=Object.keys(R.state.days); const overlap=Object.keys(r.data.days).filter(d=>R.state.days[d]).length; const viewer=R.meta.role==='viewer';
    ui.dlg={title:viewer?'このバックアップを読み込みますか？':'このバックアップから復元しますか？',
      body:`ファイル：${sm.days}日分（${sm.from?md(sm.from):'—'}〜${sm.to?md(sm.to):'—'}）・作成 ${fmtDT(h.exportedAt)}<br>今の記録：${cur.length}日分${viewer?'':`（ファイルと重なる日 ${overlap}日）`}<br>${viewer?'読み込んだ時点の記録を閲覧専用で表示します。':'今の記録をファイルの内容に置き換えます。直前の記録は写しとして残り、「復元前に戻す」で戻せます。'}`,
      acts:[{l:'やめる',a:'dlgClose',cls:'ghost'},{l:viewer?'読み込む':'置き換えて復元',a:'doImport'}]}; renderOverlay();
  }catch(e){ ui.dlg={title:'読み込めませんでした',body:esc(e.message||String(e))+'<br>今の記録は変更していません。',acts:[{l:'閉じる',a:'dlgClose'}]}; renderOverlay(); } }
async function doImport(){ const r=pendingImport; if(!r) return; pendingImport=null; const viewer=R.meta.role==='viewer';
  const next={...emptyState(),...clone(r.data),draft:null};
  try{
    if(!viewer){ await addSnapshot('復元の直前',R.state); R.meta.lastRestoreAt=new Date().toISOString(); }
    else { R.meta.viewerLoadedAt=new Date().toISOString(); R.meta.viewerExportedAt=r.head.exportedAt; }
    const tx=R.db.transaction(['kv','weather'],'readwrite'); tx.objectStore('kv').put(next,'state'); tx.objectStore('kv').put(R.meta,'meta');
    for(const [k,v] of Object.entries(r.weather)) tx.objectStore('weather').put(v,k); await txDone(tx);
    R.state=next; Object.assign(R.weather,r.weather); undoStack=[];
    ui.dlg=null; ui.stack=[]; ui.tab='home'; render(true);
    if(viewer) toast(`${Object.keys(next.days).length}日分の記録を読み込みました（閲覧専用）`); else toast(`${Object.keys(next.days).length}日分を復元しました`,{a:'undoRestore',l:'復元前に戻す'});
  }catch(e){ ui.dlg={title:'復元できませんでした',body:esc(e.message||String(e))+'<br>今の記録は変更していません。',acts:[{l:'閉じる',a:'dlgClose'}]}; renderOverlay(); } }
async function undoRestore(){ const all=await listSnapshots(); const snap=[...all].reverse().find(x=>x.reason==='復元の直前'); if(!snap) return toast('戻せる写しがありません');
  await addSnapshot('「復元前に戻す」の直前',R.state); await kvPut({state:snap.state}); R.state=snap.state; R.meta.lastRestoreAt=null; await saveMeta(); undoStack=[]; render(true); toast('復元前の記録に戻しました'); }
/* ---- 天気（Open-Meteo） ---- */
const WMO=c=> c===0?['sun','晴れ']: c<=2?['sun','晴れ時々くもり']: c===3?['cloud','くもり']: c<=48?['cloud','霧']: c<=67?['rain','雨']: c<=77?['cloud','雪']: c<=82?['rain','にわか雨']: c<=86?['cloud','雪']: ['rain','雷雨'];
function parseWx(j,today){ const d=j.daily, h=j.hourly||{time:[]}; const out={};
  d.time.forEach((t,i)=>{ const idx=[]; h.time.forEach((x,k)=>{ if(x.slice(0,10)===t) idx.push(k); });
    const mean=a=>{ if(!a) return null; const v=idx.map(k=>a[k]).filter(x=>x!=null); return v.length?Math.round(v.reduce((p,q)=>p+q,0)/v.length*10)/10:null; };
    const code=d.weather_code?d.weather_code[i]:null; const [ic,l]=code==null?['cloud','—']:WMO(code);
    out[t]={src:'Open-Meteo',i:ic,l,code,tmax:d.temperature_2m_max?d.temperature_2m_max[i]:null,tmin:d.temperature_2m_min?d.temperature_2m_min[i]:null,prec:d.precipitation_sum?d.precipitation_sum[i]:null,hum:mean(h.relative_humidity_2m),pres:mean(h.surface_pressure),prov:t>=today,at:new Date().toISOString()}; });
  return out; }
function wxNeeded(){ const need=new Set(); for(let i=0;i<14;i++) need.add(addDays(TODAY,-i));
  for(const d of Object.keys(R.state.days)) if(diffDays(TODAY,d)<=91&&d<=TODAY) need.add(d);
  return [...need].filter(d=>{ const w=R.weather[d]; return !w||w.prov&&d<TODAY||w.prov&&d===TODAY&&Date.now()-new Date(w.at)>3*3600e3; }).sort(); }
let wxBusy=false, wxLastTry=0;
async function fetchWeather(force){ if(MODE!=='real'||!R.db||wxBusy) return; if(!force&&Date.now()-wxLastTry<5*60e3) return;
  const miss=wxNeeded(); if(!miss.length){ if(force){ R.wx={state:'ok',at:new Date().toISOString()}; if(route().name==='settings') render(); } return; }
  if(!navigator.onLine){ R.wx={state:'offline'}; return; }
  wxBusy=true; wxLastTry=Date.now(); R.wx={state:'loading'};
  const past=Math.min(92,Math.max(0,diffDays(TODAY,miss[0])));
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${WX_LOC.lat}&longitude=${WX_LOC.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum&hourly=relative_humidity_2m,surface_pressure&timezone=Asia%2FTokyo&past_days=${past}&forecast_days=1`;
  try{ const res=await fetch(url,{cache:'no-store'}); if(!res.ok) throw new Error('通信エラー '+res.status); const j=await res.json(); if(!j.daily||!j.daily.time) throw new Error('想定と違う応答です');
    const got=parseWx(j,TODAY); const merged={...R.weather};
    for(const [k,v] of Object.entries(got)) if(k<=TODAY) merged[k]=v;
    for(const k of Object.keys(got)){ const cur=merged[k], prev=merged[addDays(k,-1)]; if(cur&&prev&&cur.pres!=null&&prev.pres!=null) cur.dp=Math.round((cur.pres-prev.pres)*10)/10; else if(cur) cur.dp=null; }
    const tx=R.db.transaction('weather','readwrite'); for(const k of Object.keys(got)) if(merged[k]) tx.objectStore('weather').put(merged[k],k); await txDone(tx);
    R.weather=merged; R.wx={state:'ok',at:new Date().toISOString()};
  }catch(e){ R.wx={state:'error',msg:String(e&&e.message||e),at:new Date().toISOString()}; }
  finally{ wxBusy=false; if(!ui.sheet&&!ui.dlg) render(); } }

/* ---------- 肌・疲れと生活の重なり（第4版：両方向・要約優先） ---------- */
const LOOK_SYMS={skin:'肌のかゆみ・荒れ',tired:'疲れ・だるさ'};
const LAGS=[[0,'当日'],[1,'前日'],[2,'2日前'],[3,'3日前']];
const LOOK_N=42, MIN_O=5, TH=.3, SIM=.2;
const FACTORS=[
  {id:'sleep',l:'睡眠6時間未満（前夜）',v:(D,d)=>{const r=D[d]; return !r||r.sleep==null?null:r.sleep<6;}},
  {id:'sleepLong',l:'睡眠7時間以上（前夜）',v:(D,d)=>{const r=D[d]; return !r||r.sleep==null?null:r.sleep>=7;}},
  {id:'work',l:'仕事が「重い」',v:(D,d)=>{const r=D[d]; return !r||!r.stress?null:r.stress==='high';}},
  {id:'late',l:'夕食が21時以降',v:(D,d)=>{const r=D[d]; return !r||!r.dinnerTime?null:r.dinnerTime>='21:00';}},
  {id:'sweets',l:'甘いものがあった',v:(D,d)=>{const t=tagState(D[d],'甘いもの'); return t==null?null:t==='yes';}},
  {id:'alcohol',l:'お酒があった',v:(D,d)=>{const t=tagState(D[d],'お酒'); return t==null?null:t==='yes';}},
  {id:'dry',l:'空気が乾燥（天気・デモ値）',v:(D,d)=>{const w=weatherFor(d); return !w||w.h==null?null:w.h==='乾燥';}},
  {id:'humid',l:'湿度が高め（天気・デモ値）',v:(D,d)=>{const w=weatherFor(d); return !w||w.h==null?null:w.h==='高め';}},
  {id:'pres',l:'気圧が低め（天気・デモ値）',v:(D,d)=>{const w=weatherFor(d); return !w||w.p==null?null:w.p==='低め';}}
];
function lookRange(){ const a=[]; for(let i=LOOK_N;i>=1;i--) a.push(addDays(TODAY,-i)); a.push(TODAY); return a; }
function badDays(st,sym){ return lookRange().filter(d=>st.days[d]&&st.days[d].sym[sym]>=2).reverse(); }
function lagText(labs){ // 連続した遅れは「当日〜2日前」のようにまとめる
  const idx=labs.map(l=>LAGS.findIndex(x=>x[1]===l)).sort((a,b)=>a-b);
  const cont=idx.every((v,i)=>i===0||v===idx[i-1]+1);
  return idx.length>=3&&cont ? `${LAGS[idx[0]][1]}〜${LAGS[idx[idx.length-1]][1]}` : idx.map(i=>LAGS[i][1]).join('・'); }
function overlap(st,sym){
  const ds=lookRange().filter(d=>st.days[d]&&st.days[d].sym[sym]!=null);
  const U=ds.filter(d=>st.days[d].sym[sym]>=2), C=ds.filter(d=>st.days[d].sym[sym]<=1);
  const rec=lookRange().filter(d=>st.days[d]);
  const rows=FACTORS.map(f=>{
    const lags=LAGS.map(([L,lab])=>{ const g=set=>{const v=set.map(d=>f.v(st.days,addDays(d,-L))).filter(x=>x!==null); return {n:v.length,k:v.filter(Boolean).length};};
      const u=g(U), c=g(C), ok=u.n>=MIN_O&&c.n>=MIN_O; const ru=u.n?u.k/u.n:0, rc=c.n?c.k/c.n:0; return {L,lab,u,c,ok,ru,rc,diff:ru-rc}; });
    const okL=lags.filter(x=>x.ok);
    const bad=okL.some(x=>x.diff>=TH), calm=okL.some(x=>x.diff<=-TH);
    const cls=!okL.length?'lack':bad&&calm?'mixed':bad?'bad':calm?'calm':'nodiff';
    const dir=cls==='bad'?1:cls==='calm'?-1:0;
    const sim=dir?okL.filter(x=>x.diff*dir>=SIM):[];       // 同じ向きの差がある日
    const lackL=lags.filter(x=>!x.ok).map(x=>x.lab);
    let say='';
    if(dir){ say = sim.length>=2 ? `${lagText(sim.map(x=>x.lab))}で、同じ向きの差` : `${sim[0].lab}に差（ほかの日は差が小さい）`;
      const miss=dir>0 ? Math.min(...sim.map(x=>x.u.n-x.u.k)) : Math.min(...sim.map(x=>x.c.n-x.c.k));
      say += `。${dir>0?'不調の日':'落ち着いた日'}にも、当てはまらない日が少なくとも${miss}日あります`; }
    if(cls==='mixed') say=`${lagText(okL.filter(x=>x.diff>=TH).map(x=>x.lab))}は不調の日に多く、${lagText(okL.filter(x=>x.diff<=-TH).map(x=>x.lab))}は落ち着いた日に多い`;
    if(cls==='nodiff'){ const mx=Math.max(...okL.map(x=>Math.abs(x.diff))); say = mx>=SIM ? `差はあるが目安（${Math.round(TH*100)}ポイント）より小さい` : 'どの日も、割合の差は小さい'; }
    if(cls==='lack') say='記録が少なく比べられない';
    if(lackL.length&&cls!=='lack') say+=`（${lagText(lackL)}は材料不足）`;
    const short = dir ? (sim.length>=2?lagText(sim.map(x=>x.lab)):sim[0].lab+'のみ') : cls==='mixed'?'日によって向きが違う':'';
    return {f,lags,cls,sim,say,short};
  });
  return {ds,U,C,rec,rows,enough:U.length>=MIN_O&&C.length>=MIN_O};
}
const GROUPS=[
  ['bad','不調の日に多かった条件','#C2703D'],
  ['calm','落ち着いた日に多かった条件','#3B6B53'],

  ['nodiff','はっきりした差が見えない条件','#A9B9AE'],
  ['lack','材料不足の条件','']
];

const DT_W={'18:45':'19時前','19:30':'19時台','20:30':'20時台','21:30':'21時〜'};

const LANES=[
  ['g','体調'],

  ['朝の目覚め',(r)=>!r||!r.wake?uCell:tCell(WAKE[r.wake],r.wake==='tired')],

    <div class="legend"><span><i style="background:var(--green2);border-radius:3px"></i>できた</span><span><i style="background:#B9CDBF;border-radius:3px"></i>少し</span><span><i style="background:#EED9CB;border-radius:3px"></i>できなかった</span><span><i style="border:1.5px dashed #BDB4A4;border-radius:3px"></i>未記録</span></div>`;

  <div class="card"><div class="eyebrow">取り組めた日</div>${cal}

  </div><div>

function metric(r,k){ if(!r) return null; if(k==='wake') return r.wake?{good:1,ok:.5,tired:0}[r.wake]:null; if(k==='mood') return r.mood; const v=r.sym[k]; return v==null?null:v; }
function compareExp(st,e){
  const len=e.days; const end=expEnd(e)<TODAY?expEnd(e):addDays(TODAY,-1);
  const bef=[],dur=[]; for(let i=len;i>=1;i--) bef.push(addDays(e.start,-i)); for(let d=e.start; d<=end; d=addDays(d,1)) dur.push(d);
  if(st.days[TODAY] && TODAY<=expEnd(e)) dur.push(TODAY);
  const res={}; for(const w of e.watch){ const f=ds=>{const v=ds.map(d=>metric(st.days[d],w)).filter(x=>x!==null); return {n:v.length,total:ds.length,avg:avg(v),good:w==='wake'?ds.filter(d=>st.days[d]&&st.days[d].wake==='good').length:null};}; res[w]={b:f(bef),d:f(dur)}; }
  const sl=ds=>avg(ds.map(d=>st.days[d]&&st.days[d].sleep).filter(Boolean));
  const hs=ds=>ds.filter(d=>st.days[d]&&st.days[d].stress==='high').length;
  return {res,bef,dur,sb:sl(bef),sd:sl(dur),hb:hs(bef),hd:hs(dur)};
}
function reviewBlock(st,e,c){
  const bars=e.watch.map(w=>{const {b,d}=c.res[w];
    const fmt=x=>x.avg==null?'記録なし':w==='wake'?`すっきり ${x.good}日 / 記録${x.n}日`:w==='mood'?`平均 ${x.avg.toFixed(1)}（1〜5）`:`平均 ${x.avg.toFixed(1)}（0なし〜3強い）`;
    const pct=x=>x.avg==null?0:w==='wake'?(x.n?x.good/x.n:0)*100:w==='mood'?x.avg/5*100:x.avg/3*100;
    let verdict='記録が少なく、比べられません';
    if(b.n>=3&&d.n>=3){ const bv=w==='wake'?b.good/b.n:b.avg, dv=w==='wake'?d.good/d.n:d.avg; const lowerBetter=!['wake','mood'].includes(w); const th=w==='wake'?.15:w==='mood'?.3:.3; const diff=dv-bv;
      verdict = Math.abs(diff)<th ? '記録上は、ほぼ同じでした' : ((diff<0)===lowerBetter ? `記録上は、取り組み中のほうが${lowerBetter?'軽め':'よさそう'}でした` : `記録上は、取り組み中のほうが${lowerBetter?'重め':'よくなさそう'}でした`); }
    return `<div style="margin-top:6px"><div class="lab" style="font-weight:800">${WATCH[w]}${!['wake','mood'].includes(w)?'<span class="small">（短いほど軽い）</span>':''}</div><div class="bars">
      <div class="bar"><div class="t"><span>始める前（${md(c.bef[0])}〜）</span><span>${fmt(b)}</span></div><div class="track"><b style="width:${pct(b)}%"></b></div></div>
      <div class="bar during"><div class="t"><span>取り組み中</span><span>${fmt(d)}</span></div><div class="track"><b style="width:${pct(d)}%"></b></div></div></div>
      ${AUTO_CLASSIFY?`<p class="sub" style="margin-top:6px">${verdict}</p>`:''}</div>`;}).join('<div class="divider"></div>');
  const cav=[]; if(c.sb&&c.sd&&Math.abs(c.sb-c.sd)>=.3) cav.push(`睡眠が平均${c.sb.toFixed(1)}時間 → ${c.sd.toFixed(1)}時間と変わっています。`);
  if(c.hb!==c.hd) cav.push(`仕事が「重い」日は ${c.hb}日 → ${c.hd}日でした。`);
  cav.push('前後の差だけでは、この取り組みが原因かどうかは分かりません。');
  const vs=ui.verdict&&ui.verdict.id===e.id?ui.verdict:{id:e.id,v:e.verdict,note:e.note};
  const editable=e.status==='active'||ui.reVerdict===e.id;
  return `<div class="card"><div class="sec-h">前後の比較</div>${bars}
    <div class="notice" style="margin-top:14px;margin-bottom:0">${I.info}<div>${cav.map(esc).join('<br>')}</div></div></div>
  <div class="card"><div class="sec-h">あなたの実感</div>
    ${editable?`<div class="stack">${Object.entries(VERDICT).map(([k,l])=>`<button class="opt" style="width:100%;text-align:left" data-a="verdict" data-id="${e.id}" data-v="${k}" aria-pressed="${vs.v===k}">${l}</button>`).join('')}</div>
      <textarea class="inp" id="vnote" style="width:100%;margin-top:12px" placeholder="メモ（任意）例：忙しい週だった" aria-label="振り返りメモ">${esc(vs.note||'')}</textarea>
      ${e.status==='active'?`<div class="row" style="margin-top:14px;flex-wrap:wrap;gap:10px"><button class="btn" data-a="finish" data-id="${e.id}" data-next="end" ${vs.v?'':'disabled'}>振り返って終える</button><button class="btn sec" data-a="finish" data-id="${e.id}" data-next="extend" ${vs.v?'':'disabled'}>1週間延ばす</button></div>`
      :`<button class="btn" style="margin-top:14px" data-a="saveVerdict" data-id="${e.id}" ${vs.v?'':'disabled'}>保存する</button>`}`
    :`<p style="font-weight:800;font-size:17px">${e.verdict?VERDICT[e.verdict]:'未記入'}</p>${e.note?`<p class="sub" style="margin-top:6px">「${esc(e.note)}」</p>`:''}<button class="link" data-a="reVerdict" data-id="${e.id}">実感を修正する</button>`}
  </div>`;
}

function openRec(date,{mood,step}={}){
  const st=S();
  if(st.draft && st.draft.date===date){ ui.rec=clone(st.draft); if(mood) ui.rec.data.mood=mood; }
  else {
    const exist=st.days[date];
    ui.rec={date,data:exist?clone(exist):blankRec(),step:1,slot:defaultSlot(),isEdit:!!exist,dirty:false,pending:{b:'',l:'',d:'',s:''}};
    if(mood){ ui.rec.data.mood=mood; ui.rec.dirty=true; }
  }
  if(!ui.rec.pending) ui.rec.pending={b:'',l:'',d:'',s:''};
  if(step) ui.rec.step=step;
  if(ui.rec.dirty) saveDraft();
  ui.sheet='rec'; renderOverlay();
}
function pendingList(R){ return R&&R.pending ? SLOTS.filter(([k])=>(R.pending[k]||'').trim()).map(([k,l])=>[k,l,R.pending[k].trim()]) : []; }
function hasContent(R){ return !!R && (hasAny(R.data) || pendingList(R).length>0); }
function defaultSlot(){ const h=jstHour(); return h<10?'b':h<15?'l':'d'; }
function saveDraft(){ const st=S(); st.draft=clone(ui.rec); persist(); }
function closeRec(){
  const st=S();
  if(ui.rec && ui.rec.dirty && hasContent(ui.rec)){ saveDraft(); ui.sheet=null; ui.rec=null; render(); toast('書きかけを残しました。続きはホームから'); }
  else { if(st.draft && ui.rec && st.draft.date===ui.rec.date && !hasContent(st.draft)) st.draft=null; persist(); ui.sheet=null; ui.rec=null; render(); }
}
function saveRec(){
  const st=S(); const R=ui.rec;
  const pl=pendingList(R);
  if(pl.length){ ui.dlg={title:'まだ追加されていない食事があります',body:pl.map(([k,l,t])=>`${l}：「${esc(t)}」`).join('<br>')+'<br>追加してから保存しますか？',acts:[{l:'入力に戻る',a:'dlgClose',cls:'ghost'},{l:'入れずに保存',a:'savePendingSkip',cls:'sec'},{l:'追加して保存',a:'savePendingAdd'}]}; renderOverlay(); return; }
  if(!hasAny(R.data)){ toast('まだ何も入力されていません'); return; }
  snapshot();
  R.data.savedAt=new Date().toISOString();
  st.days[R.date]=clone(R.data);
  for(const [k] of SLOTS) for(const it of R.data.meals[k].items){ st.history[k][it]=(st.history[k][it]||0)+1; }
  st.draft=null; persist();
  if(MODE==='real'){ if(!window.__R.meta.firstRecordAt){ window.__R.meta.firstRecordAt=new Date().toISOString(); saveMeta(); } dailySnapshotSoon(); }
  const isEdit=R.isEdit; const d=R.date;
  ui.sheet=null; ui.rec=null; render();
  toast(`${d===TODAY?'今日':md(d)}の記録を${isEdit?'修正':'保存'}しました`,true);
}

      <li>「比較できる傾向の例」→ 発見カード →「根拠と、当てはまらない日を見る」</li>
      <li>そのまま「これを試してみる」→ 取り組み中の扱いを確認 → 試すタブで振り返りを見る</li>
      <li>「比較できる傾向の例」→ 発見タブ「肌・疲れと生活の重なり」→ 不調の日を押し、前日・数日前を並べて見る</li>

      <li>「数日ぶりに戻ってきた」→ ホームの「おかえりなさい」と記録タブの空白表示を確認</li></ol></div>
  </div></section>`;
}
